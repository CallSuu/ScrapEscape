spring:
  application:
    name: scrap-escape
  config:
    import: optional:file:./application-local.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/scrap_escape?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson:
    deserialization:
      accept-float-as-int: false
  sql:
    init:
      mode: always
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
